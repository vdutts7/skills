# /extract - output formats

integrity: full_canonical_integrity_of_data
tampering: zero

probe_report:
  depth: deep_deep_deep
  segments_opened: "<count>"
  residue_sweeps: "<count>"

text: "complete human-readable list - every gathered item, every scraped crumb"

