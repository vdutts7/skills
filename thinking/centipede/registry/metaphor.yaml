# /centipede - core metaphor

metaphor: |
  a human centipede of personas. each link in the chain:
    1. INGESTS the previous link's full output
    2. DISSOLVES its structure (breaks the frame)
    3. IDENTIFIES what the previous link couldn't see from inside its own frame
    4. REFORMS at a deeper layer with the dissolved material
    5. OUTPUTS a new structure for the next link to ingest

  the chain is NOT a debate (that's /mirror).
  the chain is NOT parallel analysis (that's multi-persona).
  the chain is SEQUENTIAL DIGESTION: each link literally eats the previous one.

analogy: |
  /mirror = prism (one beam, split into spectrum, same domain)
  /centipede = reactor (multiple fuels, fused into new element, cross-domain)
